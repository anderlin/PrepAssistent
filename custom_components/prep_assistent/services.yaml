add_item:
  fields:
    name:
      required: true
      example: "Reis"
      selector:
        text:
    list:
      example: "Pantry"
      selector:
        text:
    category:
      example: "lebensmittel"
      selector:
        select:
          custom_value: true
          translation_key: category
          options:
            - lebensmittel
            - getraenke
            - hausapotheke
            - drogerie
            - haushalt
            - dokumente
            - tiere
            - sonstiges
    quantity:
      default: 1
      selector:
        number:
          min: 0
          max: 100000
          step: any
          mode: box
    target_quantity:
      selector:
        number:
          min: 0
          max: 100000
          step: any
          mode: box
    unit:
      example: "kg"
      selector:
        text:
    purchase_date:
      selector:
        date:
    expiry_date:
      selector:
        date:
    location:
      example: "Keller, Regal 2"
      selector:
        text:
    notes:
      selector:
        text:
          multiline: true

consume_item:
  fields:
    item_id:
      selector:
        text:
    name:
      example: "Reis"
      selector:
        text:
    list:
      selector:
        text:
    amount:
      default: 1
      selector:
        number:
          min: 0
          max: 100000
          step: any
          mode: box

apply_template:
  fields:
    template:
      required: true
      example: "bbk_notvorrat"
      selector:
        text:
    persons:
      required: true
      default: 2
      selector:
        number:
          min: 1
          max: 100
          mode: box
    days:
      required: true
      default: 10
      selector:
        number:
          min: 1
          max: 3650
          mode: box
    list:
      selector:
        text:

check_expiry:

reload_templates:
