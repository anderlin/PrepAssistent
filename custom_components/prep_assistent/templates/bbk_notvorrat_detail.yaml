# Detaillierte Variante von bbk_notvorrat.json: Sammelposten sind in Einzelartikel zerlegt,
# damit jeder Artikel einzeln nachverfolgt werden kann (Bestand, MHD).
# Die per_person_per_day-Werte je Gruppe ergeben in Summe wieder die BBK-Menge der Gruppe.
# Packungsgrößen in den Notizen sind Annahmen – bei Bedarf in einer eigenen Vorlage anpassen.
# Texte sind Sprach-Objekte (de, en, fr, es, it, ru, da, nb, sv, hu, el); unit ist ein Einheiten-Code.
id: bbk_notvorrat_detail
name: {de: "Notvorrat detailliert (Beispiel nach BBK-Empfehlung)", en: "Emergency supply, detailed (example based on German BBK recommendation)", fr: "Réserve d'urgence détaillée (exemple selon la recommandation du BBK allemand)", es: "Reserva de emergencia detallada (ejemplo según la recomendación del BBK alemán)", it: "Scorta di emergenza dettagliata (esempio secondo la raccomandazione del BBK tedesco)", ru: "Аварийный запас, подробно (пример по рекомендации немецкого BBK)", da: "Nødforsyning, detaljeret (eksempel efter tyske BBK's anbefaling)", nb: "Beredskapslager, detaljert (eksempel etter tyske BBKs anbefaling)", sv: "Krisförråd, detaljerat (exempel enligt tyska BBK:s rekommendation)", hu: "Vészhelyzeti készlet, részletes (példa a német BBK ajánlása alapján)", el: "Απόθεμα έκτακτης ανάγκης, αναλυτικό (παράδειγμα βάσει σύστασης του γερμανικού BBK)"}
description:
  de: Wie „Notvorrat (Beispiel nach BBK-Empfehlung)“, aber jede Lebensmittelgruppe ist in Einzelartikel aufgeteilt. Mengen pro Person und Tag.
  en: Like “Emergency supply (example …)”, but every food group is split into individual items. Quantities per person and day.
  fr: Comme « Réserve d'urgence (exemple …) », mais chaque groupe d'aliments est divisé en articles individuels. Quantités par personne et par jour.
  es: Como «Reserva de emergencia (ejemplo …)», pero cada grupo de alimentos se divide en artículos individuales. Cantidades por persona y día.
  it: Come «Scorta di emergenza (esempio …)», ma ogni gruppo di alimenti è suddiviso in singoli articoli. Quantità per persona e giorno.
  ru: Как «Аварийный запас (пример …)», но каждая группа продуктов разбита на отдельные товары. Количество на человека в день.
  da: Som »Nødforsyning (eksempel …)«, men hver fødevaregruppe er opdelt i enkelte varer. Mængder pr. person og dag.
  nb: Som «Beredskapslager (eksempel …)», men hver matvaregruppe er delt opp i enkeltvarer. Mengder per person og dag.
  sv: Som ”Krisförråd (exempel …)”, men varje livsmedelsgrupp är uppdelad i enskilda artiklar. Mängder per person och dag.
  hu: Mint a „Vészhelyzeti készlet (példa …)”, de minden élelmiszercsoport külön tételekre van bontva. Mennyiségek személyenként és naponta.
  el: Όπως το «Απόθεμα έκτακτης ανάγκης (παράδειγμα …)», αλλά κάθε ομάδα τροφίμων χωρίζεται σε μεμονωμένα είδη. Ποσότητες ανά άτομο και ημέρα.
default_persons: 2
default_days: 10
