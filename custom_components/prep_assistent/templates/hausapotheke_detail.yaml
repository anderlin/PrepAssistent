# Detaillierte Variante von hausapotheke.yaml: Sammelposten sind in Einzelartikel zerlegt,
# damit jeder Artikel einzeln nachverfolgt werden kann (Bestand, Verfallsdatum).
id: hausapotheke_detail
name: {de: "Hausapotheke detailliert (Beispiel)", en: "Home medicine cabinet, detailed (example)", fr: "Pharmacie familiale détaillée (exemple)", es: "Botiquín doméstico detallado (ejemplo)", it: "Farmacia di casa dettagliata (esempio)", ru: "Домашняя аптечка, подробно (пример)", da: "Husapotek, detaljeret (eksempel)", nb: "Husapotek, detaljert (eksempel)", sv: "Husapotek, detaljerat (exempel)", hu: "Házipatika, részletes (példa)", el: "Φαρμακείο σπιτιού, αναλυτικό (παράδειγμα)"}
description:
  de: Wie „Hausapotheke (Beispiel)“, aber jeder Sammelposten ist in Einzelartikel aufgeteilt. Verbrauchsmaterial skaliert mit der Personenzahl.
  en: Like “Home medicine cabinet (example)”, but every combined item is split into individual items. Consumables scale with the number of persons.
  fr: Comme « Pharmacie familiale (exemple) », mais chaque poste groupé est divisé en articles individuels. Les consommables varient selon le nombre de personnes.
  es: Como «Botiquín doméstico (ejemplo)», pero cada partida agrupada se divide en artículos individuales. El material consumible se ajusta al número de personas.
  it: Come «Farmacia di casa (esempio)», ma ogni voce raggruppata è suddivisa in singoli articoli. Il materiale di consumo si adatta al numero di persone.
  ru: Как «Домашняя аптечка (пример)», но каждая сборная позиция разбита на отдельные товары. Расходные материалы рассчитываются по числу людей.
  da: Som »Husapotek (eksempel)«, men hver samlepost er opdelt i enkelte varer. Forbrugsvarer skaleres efter antal personer.
  nb: Som «Husapotek (eksempel)», men hver samlepost er delt opp i enkeltvarer. Forbruksmateriell skaleres etter antall personer.
  sv: Som ”Husapotek (exempel)”, men varje samlingspost är uppdelad i enskilda artiklar. Förbrukningsmaterial anpassas efter antal personer.
  hu: Mint a „Házipatika (példa)”, de minden összevont tétel külön tételekre van bontva. A fogyóeszközök a személyek számával arányosak.
  el: Όπως το «Φαρμακείο σπιτιού (παράδειγμα)», αλλά κάθε ομαδοποιημένο είδος χωρίζεται σε μεμονωμένα είδη. Τα αναλώσιμα προσαρμόζονται στον αριθμό των ατόμων.
default_persons: 2
default_days: 30
